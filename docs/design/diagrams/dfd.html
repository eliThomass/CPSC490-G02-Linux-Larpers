<style>
/* Layout: plain white canvas, each diagram on its own page-like board, scrolls sideways when wider than the screen */
:root{
  --bg:#ffffff; --ink:#222222; --muted:#666666; --grid:#e6e6e6;
  --ent-fill:#fff2cc; --ent-line:#c9a227;
  --proc-fill:#dae8fc; --proc-line:#5b85c6;
  --store-fill:#d5e8d4; --store-line:#6aa36a;
  --bound:#9a9a9a; --arrow:#333333;
  --font:Arial,"Liberation Sans",Helvetica,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.board{margin:0 auto 36px;max-width:1924px}
.page-title{max-width:1924px;margin:0 auto 16px;font-size:26px;font-weight:bold;line-height:1.2;color:var(--ink)}
.scroll{overflow-x:auto;border:1px solid var(--grid)}
.dfd{display:block;background:#fff}
.l0{width:1060px;max-width:none}
.l1{width:1920px;max-width:none}
.dfd text{font-family:var(--font);fill:var(--ink)}
.ctitle{font-size:18px;font-weight:bold}
.ttl{font-size:14px}
.pid,.sid{font-size:13px;font-weight:bold}
.lbl{font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.blbl{font-size:14px;font-weight:bold;fill:#555!important}
.lh{font-size:14px;font-weight:bold}
.lt{font-size:13px}
.note{font-size:13px;font-style:italic;fill:var(--muted)!important}
.ent rect,.ent-s{fill:var(--ent-fill);stroke:var(--ent-line);stroke-width:1.5}
.proc rect,.proc-s{fill:var(--proc-fill);stroke:var(--proc-line);stroke-width:1.5}
.proc line{stroke:var(--proc-line);stroke-width:1}
.dash rect,.dash line,.proc-s.dash{stroke-dasharray:6 4}
.store rect,.store-s{fill:var(--store-fill)}
.store path,.store-l{fill:none;stroke:var(--store-line);stroke-width:1.5}
.bound{fill:none;stroke:var(--bound);stroke-width:1.2;stroke-dasharray:8 5}
.legend{fill:#fff;stroke:#bbbbbb;stroke-width:1}
.flow{fill:none;stroke:var(--arrow);stroke-width:1.4;marker-end:url(#ah)}
.mk{fill:var(--arrow)}
</style>
